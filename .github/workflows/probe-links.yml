name: Probe share link
# One-off: resolves a Google share link on a runner (open internet) and saves the page it lands on.
on:
  push:
    paths: [".github/workflows/probe-links.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - name: Probe
        run: |
          d=fixtures/probe2; mkdir -p $d
          UA='Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          u=https://share.google/TC8WuTDC7WIqs44J3
          : > $d/chain.txt
          for i in 1 2 3 4 5 6; do
            out=$(curl -s -m 20 -A "$UA" -o $d/page.html -w '%{http_code} %{redirect_url}' "$u")
            echo "$i $u -> $out" >> $d/chain.txt
            next=$(echo "$out" | cut -d' ' -f2-); [ -z "$next" ] && break; u="$next"
          done
          echo "== widgets:" >> $d/chain.txt
          python3 - $d/page.html >> $d/chain.txt <<'PY' || true
          import sys,json
          h=open(sys.argv[1]).read()
          m=h.find('window.__INITIAL_DATA__')
          if m<0: print('no __INITIAL_DATA__'); print([l for l in h.split('<script')[1:6]][:3] and ''); sys.exit()
          i=h.index('"',m); j=i+1
          while j<len(h):
              c=h[j]
              if c=='\\': j+=2; continue
              if c=='"': break
              j+=1
          root=json.loads(json.loads(h[i:j+1]))
          for k,v in root['data'].items(): print(v.get('name'),'|',k[:120])
          PY
          grep -o '<script[^>]*id="[^"]*"' $d/page.html | head -5 >> $d/chain.txt || true
          cat $d/chain.txt
      - name: Commit
        run: |
          git config user.name "fixtures-bot"; git config user.email "fixtures-bot@users.noreply.github.com"
          git add fixtures && git commit -m "Probe share link" && git push
