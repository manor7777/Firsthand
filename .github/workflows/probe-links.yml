name: Probe share links and video pages
# One-off: resolves a Google share link and captures a BBC /news/videos page on a runner (open internet).
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe-links.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - name: Probe
        run: |
          d=fixtures/probe; mkdir -p $d
          UA='Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          # Redirect chain, one hop at a time, as OkHttp will see it (no JS).
          u=https://share.google/EuaV7JI0KoM2JP2RD
          : > $d/share-chain.txt
          for i in 1 2 3 4 5 6 7; do
            out=$(curl -s -m 20 -A "$UA" -o $d/share-hop$i.html -w '%{http_code} %{redirect_url}' "$u")
            echo "$i $u -> $out" >> $d/share-chain.txt
            next=$(echo "$out" | cut -d' ' -f2-)
            [ -z "$next" ] && break
            u="$next"
          done
          grep -oE 'https?://(www\.)?bbc\.(com|co\.uk)/news/[^"<> ]+' $d/share-hop*.html | sort -u | head -20 >> $d/share-chain.txt || true
          v=$(echo "$u" | grep -E '/news/videos/' || true)
          [ -z "$v" ] && v=$(curl -sL -A "$UA" https://www.bbc.co.uk/news | grep -oE '/news/videos/[A-Za-z0-9]+' | head -1 | sed 's#^#https://www.bbc.co.uk#')
          echo "video: $v" >> $d/share-chain.txt
          [ -n "$v" ] && curl -sL -m 30 -A "$UA" -o $d/video.html "$v"
          ls -la $d >> $d/share-chain.txt
          cat $d/share-chain.txt
      - name: Commit
        run: |
          git config user.name "fixtures-bot"; git config user.email "fixtures-bot@users.noreply.github.com"
          git add fixtures && git commit -m "Probe share link and video page" && git push
