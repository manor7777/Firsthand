name: Screenshots
# Boots an Android emulator, installs a debug build, tours the main screens and commits the screenshots to docs/screenshots,
# then updates the screenshots section of README.md. Run it by hand (Actions > Screenshots > Run workflow) after UI changes.
# The pictures show whatever news is live at the time, from the sources the tour adds (BBC News by default, plus Example Post).
on:
  workflow_dispatch:
    inputs:
      theme:
        description: "Theme for the screenshots"
        type: choice
        options: [dark, light]
        default: dark

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          THEME: ${{ inputs.theme }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/screenshots/shoot.sh app/build/outputs/apk/debug/app-debug.apk docs/screenshots
      - name: Shrink the images
        run: |
          pip install --quiet pillow
          python3 tools/screenshots/shrink.py
          ls -la docs/screenshots
      - name: Keep the raw run (screenshots and any screen dumps) for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-run
          path: |
            docs/screenshots
            /tmp/dumps
          if-no-files-found: ignore
      - name: Update the README
        run: python3 tools/screenshots/update_readme.py
      - name: Commit
        run: |
          git config user.name "screenshots-bot"; git config user.email "screenshots-bot@users.noreply.github.com"
          git add docs/screenshots README.md
          git commit -m "Update screenshots [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break; sleep 3; done
