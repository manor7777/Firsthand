name: Probe BBC topic endpoints
# One-off: fetch public BBC topic/search pages on a GitHub runner and commit them as fixtures (same approach as fixtures.yml).
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - name: Fetch
        run: |
          d=fixtures/probe; mkdir -p $d; : > $d/_summary.txt
          UA='Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          get() { curl -sL -m 30 -A "$UA" -w "%{http_code} %{content_type} $1\n" -o "$d/$2" "$1" >> $d/_summary.txt; }
          get "https://www.bbc.co.uk/search?q=diabetes&d=NEWS_GNL" search_news.html
          get "https://www.bbc.co.uk/search?q=diabetes" search_all.html
          get "https://www.bbc.co.uk/news/topics/c48yrnxyk79t" topic.html
          get "https://feeds.bbci.co.uk/news/topics/c48yrnxyk79t/rss.xml" topic_rss.xml
          get "https://www.bbc.co.uk/news/topics/c48yrnxyk79t/rss.xml" topic_rss2.xml
          get "https://www.bbc.co.uk/news/health/rss.xml" health_alt.xml
          get "https://www.bbc.co.uk/search/suggest?q=diab" suggest.json
          get "https://search-suggest.api.bbci.co.uk/search-suggest/diabetes" suggest2.json
          get "https://www.bbc.co.uk/news/topics" topics_index.html
          for f in $d/*.html; do echo "== $f: $(wc -c < $f) bytes; INITIAL_DATA: $(grep -c '__INITIAL_DATA__' $f)" >> $d/_summary.txt; done
          cat $d/_summary.txt
      - name: Commit
        run: |
          git config user.name "fixtures-bot"; git config user.email "fixtures-bot@users.noreply.github.com"
          git add fixtures && git commit -m "Probe BBC topic endpoints" && git push
