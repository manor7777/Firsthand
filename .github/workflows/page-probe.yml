name: Page probe
# One-off diagnostic: why can't the reader get the text of one story? Prints a structural summary of that single page to the log.
on:
  workflow_dispatch:
    inputs:
      feed: { description: "Feed address", default: "https://feeds.skynews.com/feeds/rss/technology.xml" }
      keyword: { description: "Word in the story's title", default: "Anthropic" }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/diagnose/page_probe.py "${{ inputs.feed }}" "${{ inputs.keyword }}"
