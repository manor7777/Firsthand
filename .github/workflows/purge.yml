name: Purge old releases
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for t in $(gh release list --limit 200 --json tagName -q '.[].tagName'); do
            gh release delete "$t" --cleanup-tag -y >/dev/null 2>&1 && echo "deleted release"
          done
          for t in $(gh api repos/$GH_REPO/git/matching-refs/tags -q '.[].ref' | sed 's#refs/tags/##'); do
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$t" >/dev/null 2>&1 && echo "deleted tag"
          done
          for id in $(gh api --paginate "repos/$GH_REPO/actions/runs?per_page=100" -q '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id'); do
            gh api -X DELETE "repos/$GH_REPO/actions/runs/$id" >/dev/null 2>&1 && echo "deleted run"
          done
