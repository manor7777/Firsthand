name: Build APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with the APK (what the in-app updater installs)"
        type: boolean
        default: false
      test_key:
        description: "TEST BUILD: sign with a throwaway key made in this run (artifact only; cannot be combined with release)"
        type: boolean
        default: false
      app_id:
        description: "TEST BUILD: override the application ID so it installs beside the real app (blank = app.firsthand)"
        type: string
        default: ""

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build number
        run: |
          # Firsthand's run numbers restart at 1, so offset them above the BBC-Revived builds already installed.
          n=${{ github.run_number }}
          [ "${{ github.repository }}" = "manor7777/Firsthand" ] && n=$((n + 100))
          echo "BUILD_NUMBER=$n" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest -PbuildNumber=${{ env.BUILD_NUMBER }}
      - name: Test builds can't be released
        if: github.event_name == 'workflow_dispatch' && inputs.release && (inputs.test_key || inputs.app_id != '')
        run: echo "::error::test_key / app_id builds are for artifacts only; untick release." && exit 1
      - name: Signing key
        env:
          TEST_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_key }}
          B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_AL: ${{ secrets.KEY_ALIAS }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$TEST_KEY" = "true" ]; then
            keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storepass testpass123 -keypass testpass123 \
              -alias test -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Firsthand test build"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/test.jks"
              echo "KEYSTORE_PASSWORD=testpass123"
              echo "KEY_ALIAS=test"
              echo "KEY_PASSWORD=testpass123"
            } >> "$GITHUB_ENV"
          elif [ -n "$B64" ]; then
            echo "$B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$STORE_PW"
              echo "KEY_ALIAS=$KEY_AL"
              echo "KEY_PASSWORD=${KEY_PW:-$STORE_PW}"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set: this APK is debug-signed and can't update a release build."
          fi
      - name: Assemble release APK
        env:
          APP_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.app_id || '' }}
        run: ./gradlew assembleRelease -PbuildNumber=${{ env.BUILD_NUMBER }} -PappId="$APP_ID"
      - name: Name the APK
        run: mv app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/firsthand-0.1.${{ env.BUILD_NUMBER }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: firsthand-0.1.${{ env.BUILD_NUMBER }}
          path: app/build/outputs/apk/release/*.apk
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Unsigned (debug-key) builds are published as pre-releases so the in-app updater (latest release) never offers them.
          flag=""
          [ -z "$KEYSTORE_PATH" ] && flag="--prerelease"
          gh release create "v0.1.${{ env.BUILD_NUMBER }}" app/build/outputs/apk/release/*.apk \
            --title "Firsthand 0.1.${{ env.BUILD_NUMBER }}" \
            --notes "$(git log -1 --pretty=%B)" --target "$GITHUB_SHA" $flag
