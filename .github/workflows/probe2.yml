name: Probe keyword topics
# One-off diagnostic (public BBC pages only); writes fixtures/probe2/resolve.txt.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe2.yml", ".github/scripts/resolve_probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - run: python3 .github/scripts/resolve_probe.py
      - run: |
          git config user.name "fixtures-bot"; git config user.email "fixtures-bot@users.noreply.github.com"
          git add fixtures && git commit -m "Probe keyword topics" && git push
